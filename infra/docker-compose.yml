# Sobe os três serviços. Padrão: backend com H2 em memória e dados de demonstração.
# Com Oracle: docker compose -f infra/docker-compose.yml --profile oracle up --build
#   (e defina SPRING_PROFILES_ACTIVE=oracle no backend, ver .env.exemplo).
services:
  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      IA_SERVICE_URL: http://ia-service:8000
      CORS_ORIGENS: http://localhost:8080,http://localhost:5173
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
      DB_URL: ${DB_URL:-jdbc:h2:mem:temdireito;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports: ["8081:8081"]
    depends_on: [ia-service]

  ia-service:
    build: ../ia-service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-claude-haiku-5-5}
    ports: ["8000:8000"]

  frontend:
    build: ../frontend
    ports: ["8080:8080"]
    depends_on: [backend]

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-TemDireito2026}
      APP_USER: temdireito
      APP_USER_PASSWORD: ${DB_PASSWORD:-TemDireito2026}
    ports: ["1521:1521"]
