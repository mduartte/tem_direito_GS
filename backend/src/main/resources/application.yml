# Configuração do backend do Tem Direito.
# Padrão: H2 em memória no modo Oracle, com dados de demonstração, para rodar sem instalar nada.
# Produção: perfil "oracle" (application-oracle.yml) e variáveis de ambiente para os segredos.
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: tem-direito-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:temdireito;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é criado pelo Flyway (database/ e resources/db/migration), nunca pelo Hibernate.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    locations: classpath:db/migration/comum,classpath:db/migration/h2
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Origens que podem chamar a API pelo navegador (frontend em dev e em produção).
  cors-origens: ${CORS_ORIGENS:http://localhost:5173,http://localhost:8080,http://localhost:4173}
  # Segredo do JWT. Em produção vem de variável de ambiente (Azure: secret do Container App).
  jwt-segredo: ${JWT_SEGREDO:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
  jwt-horas: 12
  # Chave para cifrar o telefone (AES-GCM, base64 de 32 bytes) e sal do hash. Trocar em produção.
  cripto-chave: ${CRIPTO_CHAVE:dGVtLWRpcmVpdG8tY2hhdmUtZGUtZGVtby0zMi1ieXQ=}
  hash-sal: ${HASH_SAL:sal-de-demonstracao}
  # URL do serviço de IA (Python). Sem ele, o assistente avisa que está indisponível.
  ia-service-url: ${IA_SERVICE_URL:http://localhost:8000}
  # Gera triagens de demonstração (como no protótipo) quando o banco está vazio.
  demo: ${APP_DEMO:true}
  # Mostra códigos de verificação na resposta (só em desenvolvimento, sem SMS real).
  expor-codigo-teste: ${EXPOR_CODIGO_TESTE:true}
  # CEP: consulta o ViaCEP; se a rede bloquear, usa as faixas de CEP do piloto.
  viacep-url: ${VIACEP_URL:https://viacep.com.br/ws}
  sms:
    # log = só registra (desenvolvimento); twilio = envia de verdade (precisa das credenciais).
    provider: ${SMS_PROVIDER:log}
    twilio-sid: ${TWILIO_SID:}
    twilio-token: ${TWILIO_TOKEN:}
    twilio-de: ${TWILIO_DE:}
